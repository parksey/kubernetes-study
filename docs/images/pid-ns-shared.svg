<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" width="760" height="184" role="img" aria-label="chroot만 한 상태에서는 nginx와 sh가 같은 PID 네임스페이스에 있어서 sh에서 nginx가 보이고 kill도 된다">
  <style>
    .t-code { fill: #18202B; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .t-id { fill: #5B6676; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
    .t-sub { fill: #5B6676; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 11.5px; font-weight: 500; }
    .t-h { fill: #18202B; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 14px; font-weight: 700; }
    .t-body { fill: #18202B; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 13px; font-weight: 500; }
    .t-ok { fill: #2B7A47; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .ns { fill: #FFFFFF; stroke: #CBD3DC; stroke-width: 1.5; }
    .chip { fill: #FFFFFF; stroke: #18202B; stroke-width: 1.2; }
  </style>
  <rect x="0" y="0" width="760" height="184" fill="#FFFFFF"/>

  <text x="16" y="24" class="t-h">chroot만 한 상태</text>

  <rect x="16" y="36" width="728" height="84" rx="6" class="ns"/>
  <text x="32" y="56" class="t-h">PID 네임스페이스 (하나)</text>
  <text x="728" y="56" text-anchor="end" class="t-id">4026532694</text>

  <rect x="32" y="66" width="160" height="44" rx="5" class="chip"/>
  <text x="112" y="84" text-anchor="middle" class="t-code">nginx (PID 14)</text>
  <text x="112" y="101" text-anchor="middle" class="t-sub">터미널 1</text>

  <rect x="208" y="66" width="160" height="44" rx="5" class="chip"/>
  <text x="288" y="84" text-anchor="middle" class="t-code">sh</text>
  <text x="288" y="101" text-anchor="middle" class="t-sub">터미널 2</text>

  <text x="20" y="146" class="t-ok">O</text>
  <text x="40" y="146" class="t-body">sh에서 <tspan class="m">ps</tspan>를 하면 nginx가 보입니다.</text>

  <text x="20" y="170" class="t-ok">O</text>
  <text x="40" y="170" class="t-body">sh에서 <tspan class="m">kill 14</tspan>를 하면 nginx가 죽습니다.</text>
</svg>