<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" role="img" aria-label="PID 네임스페이스를 분리하면 sh는 새 네임스페이스 안에서 PID 1이 되고, 안에서는 바깥 nginx를 kill할 수 없지만 밖에서는 sh를 kill할 수 있다">
  <style>
    .t-code { fill: #18202B; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .t-id { fill: #5B6676; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
    .t-sub { fill: #5B6676; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 11.5px; font-weight: 500; }
    .t-h { fill: #18202B; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 14px; font-weight: 700; }
    .t-acc { fill: #0E7A84; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 14px; font-weight: 700; }
    .t-body { fill: #18202B; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 13px; font-weight: 500; }
    .t-ok { fill: #2B7A47; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .t-no { fill: #B3382C; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .ns { fill: #FFFFFF; stroke: #CBD3DC; stroke-width: 1.5; }
    .ns-acc { fill: #E0F0F1; stroke: #0E7A84; stroke-width: 1.5; }
    .chip { fill: #FFFFFF; stroke: #18202B; stroke-width: 1.2; }
  </style>
  <rect x="0" y="0" width="760" height="242" fill="#FFFFFF"/>

  <text x="16" y="24" class="t-h">PID 네임스페이스 분리 후</text>

  <rect x="16" y="36" width="728" height="142" rx="6" class="ns"/>
  <text x="32" y="56" class="t-h">원래 PID 네임스페이스</text>
  <text x="728" y="56" text-anchor="end" class="t-id">4026532694</text>

  <rect x="32" y="102" width="160" height="44" rx="5" class="chip"/>
  <text x="112" y="120" text-anchor="middle" class="t-code">nginx (PID 69)</text>
  <text x="112" y="137" text-anchor="middle" class="t-sub">터미널 1</text>

  <rect x="208" y="70" width="520" height="92" rx="6" class="ns-acc"/>
  <text x="224" y="90" class="t-acc">새 PID 네임스페이스</text>
  <text x="712" y="90" text-anchor="end" class="t-id">4026532798</text>

  <rect x="224" y="102" width="240" height="44" rx="5" class="chip"/>
  <text x="344" y="120" text-anchor="middle" class="t-code">sh</text>
  <text x="344" y="137" text-anchor="middle" class="t-sub">안에서 PID 1 · 밖에서 PID 110</text>

  <text x="20" y="204" class="t-no">X</text>
  <text x="40" y="204" class="t-body">안에서 <tspan class="m">kill 69</tspan>: <tspan class="m">No such process</tspan></text>

  <text x="20" y="228" class="t-ok">O</text>
  <text x="40" y="228" class="t-body">밖에서 <tspan class="m">kill 110</tspan>: sh가 죽습니다.</text>
</svg>