<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 130" width="760" height="130" role="img" aria-label="ip link set veth1 netns nginx 이후 veth0은 현재 netns에 남고 veth1만 nginx netns로 옮겨져 랜선이 두 namespace를 잇는다">
  <style>
    .t-code { fill: #18202B; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .t-id { fill: #5B6676; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
    .t-h { fill: #18202B; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 14px; font-weight: 700; }
    .t-acc { fill: #0E7A84; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 14px; font-weight: 700; }
    .t-acc-s { fill: #0E7A84; font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 11.5px; font-weight: 500; }
    .t-good { fill: #2B7A47; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
    .t-step { fill: #18202B; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
    .t-step-n { fill: #0E7A84; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
    .ns { fill: #FFFFFF; stroke: #CBD3DC; stroke-width: 1.5; }
    .ns-acc { fill: #E0F0F1; stroke: #0E7A84; stroke-width: 1.5; }
    .chip { fill: #FFFFFF; stroke: #18202B; stroke-width: 1.2; }
    .chip-off { fill: #FFFFFF; stroke: #5B6676; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .cable { stroke: #0E7A84; stroke-width: 3; fill: none; stroke-linecap: round; }
  </style>
  <rect x="0" y="0" width="760" height="130" fill="#FFFFFF"/>

  <text x="16" y="24" class="t-step-n">2</text>
  <text x="32" y="24" class="t-step">ip link set veth1 netns nginx</text>

  <rect x="16" y="36" width="330" height="84" rx="6" class="ns"/>
  <text x="32" y="56" class="t-h">현재 netns</text>
  <rect x="414" y="36" width="330" height="84" rx="6" class="ns-acc"/>
  <text x="430" y="56" class="t-acc">nginx netns</text>

  <rect x="210" y="66" width="120" height="44" rx="5" class="chip-off"/>
  <text x="270" y="84" text-anchor="middle" class="t-code">veth0@if3</text>
  <text x="270" y="101" text-anchor="middle" class="t-id">DOWN</text>

  <line x1="330" y1="88" x2="438" y2="88" class="cable"/>
  <text x="380" y="80" text-anchor="middle" class="t-acc-s">벽을 넘음</text>

  <rect x="438" y="66" width="120" height="44" rx="5" class="chip-off"/>
  <text x="498" y="84" text-anchor="middle" class="t-code">veth1@if4</text>
  <text x="498" y="101" text-anchor="middle" class="t-id">DOWN</text>

  <rect x="600" y="66" width="120" height="44" rx="5" class="chip"/>
  <text x="660" y="84" text-anchor="middle" class="t-code">lo</text>
  <text x="660" y="101" text-anchor="middle" class="t-good">UP</text>
</svg>
