# 소스 레포(example-project)의 CI
# main에 push → 테스트 → 이미지 빌드, push → 배포 레포의 image tag 수정
# ArgoCD는 이 레포를 보지 않는다. 클러스터 배포는 배포 레포를 보는 ArgoCD가 한다
name: ci

on:
  push:
    branches: [main]

env:
  # Settings > Secrets and variables > Actions 에 등록
  #   vars.DOCKERHUB_USERNAME     : Docker Hub 아이디
  #   secrets.DOCKERHUB_TOKEN     : Docker Hub access token
  #   secrets.DEPLOY_REPO_TOKEN   : 배포 레포에 push 할 수 있는 GitHub PAT
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/example-project

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  build:
    needs: test # 테스트가 실패하면 실행되지 않는다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          # latest 대신 커밋 SHA를 태그로 → YAML이 바뀌어야 ArgoCD가 감지한다
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  update-deploy-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 소스 레포가 아니라 배포 레포를 checkout
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/example-project-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
      - name: image tag 수정 후 commit, push
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ github.sha }}\"/" example-project/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: example-project ${{ github.sha }}"
          git push
