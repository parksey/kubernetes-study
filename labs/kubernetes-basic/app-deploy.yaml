apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app-container
          image: api-node:v1
          ports:
            - containerPort: 8080
          imagePullPolicy: Never

---

apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30090

