apiVersion: networking.k8s.io/v1 # networking group
kind: Ingress
metadata:
  name: app-ingress
spec:
  # 어떤 Ingress Controller가 처리할지 (kubectl get ingressclass)
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /app1 으로 시작하는 요청 → app1-service
          - path: /app1
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
          # /app2 로 시작하는 요청 → app2-service
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: 80
