apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: hashicorp/http-echo
          # 요청이 오면 이 텍스트를 응답 (어느 앱으로 라우팅됐는지 확인용)
          args: ["-text=hello from app1", "-listen=:5678"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app1-service
spec:
  type: ClusterIP
  selector:
    app: app1
  ports:
    - port: 80 # 서비스가 받는 포트 (ingress가 이 포트로 보냄)
      targetPort: 5678 # 파드의 포트
