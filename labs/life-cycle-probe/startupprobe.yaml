apiVersion: v1
kind: Pod
metadata:
  name: startup
spec:
  containers:
    - name: container
      image: busybox
      command: ["sh", "-c", "sleep 15 && touch /tmp/ready && sleep 3600"]
      startupProbe:
        exec:
          command:
            - cat
            - /tmp/ready
        failureThreshold: 10
        periodSeconds: 3
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/ready
        periodSeconds: 5