apiVersion: v1
kind: Pod
metadata:
  name: tcp
spec:
  containers:
    - name: nginx
      image: nginx
      livenessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5