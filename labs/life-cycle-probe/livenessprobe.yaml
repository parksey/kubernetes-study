apiVersion: v1
kind: Pod
metadata:
  name: liveness
spec:
  containers:
    - name: liveness-container
      image: busybox
      args:
        - /bin/sh
        - -c
        - touch /tmp/healthy; sleep5; rm -f /tmp/healthy; sleep  600
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 3
        periodSeconds: 3