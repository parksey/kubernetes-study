apiVersion: v1
kind: Pod
metadata:
  name: configmap-pod
spec:
  containers:
    - name: pod
      image: busybox
      command: ["sh", "-c", "echo $PROFILE $LOG_LEVEL $DATABASE_HOST && sleep 3600"]
      env:
        - name: PROFILE
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: PROFILE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: LOG_LEVEL